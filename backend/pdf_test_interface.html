<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackNU25 Resume Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            padding: 30px;
        }

        .upload-section {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: border-color 0.3s;
        }

        .upload-section.drag-over {
            border-color: #667eea;
            background-color: #f8f9ff;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: transform 0.2s;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result.error {
            background: #fff5f5;
            border-left-color: #e53e3e;
        }

        .result.success {
            background: #f0fff4;
            border-left-color: #38a169;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-info {
            background: #e6f3ff;
            border: 1px solid #b3d9ff;
            border-radius: 6px;
            padding: 15px;
            margin: 15px 0;
        }

        .metadata {
            background: #f7f7f7;
            border-radius: 6px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 HackNU25 Resume Analyzer</h1>
            <p>Upload resume PDF for automatic structured analysis</p>
        </div>

        <div class="content">
            <!-- File Upload Section -->
            <div class="upload-section" id="uploadSection">
                <div>
                    <h3>📄 Upload PDF Document</h3>
                    <p>Drag and drop a PDF file here, or click to browse</p>
                    <input type="file" id="fileInput" class="file-input" accept=".pdf">
                    <button type="button" class="upload-btn" onclick="document.getElementById('fileInput').click()">
                        Choose PDF File
                    </button>
                </div>
                <div id="fileInfo" class="file-info" style="display: none;">
                    <strong>Selected file:</strong> <span id="fileName"></span><br>
                    <strong>Size:</strong> <span id="fileSize"></span>
                </div>
            </div>

            <!-- Analysis Options -->
            <div class="form-group">
                <label for="keywordsInput">Keywords for analysis:</label>
                <input type="text" id="keywordsInput" placeholder="Enter keywords to analyze in the PDF...">
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button type="button" class="action-btn" id="analyzeBtn" onclick="analyzeWithKeywords()">
                    � Analyze with Keywords
                </button>
                <button type="button" class="action-btn" id="parseBtn" onclick="parseResume()">
                    📄 Extract Text (PyPDF)
                </button>
            </div>

            <!-- Results -->
            <div id="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        let selectedFile = null;

        // File upload handling
        const fileInput = document.getElementById('fileInput');
        const uploadSection = document.getElementById('uploadSection');
        const fileInfo = document.getElementById('fileInfo');

        fileInput.addEventListener('change', handleFileSelect);
        uploadSection.addEventListener('dragover', handleDragOver);
        uploadSection.addEventListener('drop', handleDrop);
        uploadSection.addEventListener('dragleave', handleDragLeave);

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                showFileInfo(file);
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            uploadSection.classList.add('drag-over');
        }

        function handleDrop(event) {
            event.preventDefault();
            uploadSection.classList.remove('drag-over');
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                const file = files[0];
                if (file.type === 'application/pdf') {
                    selectedFile = file;
                    fileInput.files = files;
                    showFileInfo(file);
                } else {
                    showResult('Only PDF files are supported!', 'error');
                }
            }
        }

        function handleDragLeave(event) {
            uploadSection.classList.remove('drag-over');
        }

        function showFileInfo(file) {
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('fileSize').textContent = formatFileSize(file.size);
            fileInfo.style.display = 'block';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showResult(content, type = 'success') {
            const result = document.getElementById('result');
            result.innerHTML = content;
            result.className = `result ${type}`;
            result.style.display = 'block';
        }

        function showLoading(buttonId, text) {
            const button = document.getElementById(buttonId);
            button.disabled = true;
            button.innerHTML = `<span class="loading"></span>${text}`;
        }

        function hideLoading(buttonId, originalText) {
            const button = document.getElementById(buttonId);
            button.disabled = false;
            button.innerHTML = originalText;
        }

        async function makeRequest(endpoint, formData, buttonId, originalText) {
            try {
                showLoading(buttonId, 'Processing...');

                const response = await fetch(`http://127.0.0.1:8001/api/v1/${endpoint}`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    return { success: true, data };
                } else {
                    return { success: false, error: data.detail || 'Unknown error' };
                }
            } catch (error) {
                return { success: false, error: `Network error: ${error.message}` };
            } finally {
                hideLoading(buttonId, originalText);
            }
        }

        async function analyzeWithKeywords() {
            if (!selectedFile) {
                showResult('Please select a PDF file first!', 'error');
                return;
            }

            const keywords = document.getElementById('keywordsInput').value.trim();
            if (!keywords) {
                showResult('Please enter keywords for analysis!', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('keywords', keywords);
            formData.append('extract_text', 'false');

            const result = await makeRequest('analyze-pdf', formData, 'analyzeBtn', '� Analyzing...');

            if (result.success) {
                const analysis = result.data;
                let content = '<h3>� Keyword-Based Analysis</h3>';
                
                if (analysis.success) {
                    content += `<p><strong>Keywords:</strong> ${keywords}</p>`;
                    
                    if (analysis.metadata) {
                        content += `<p><strong>📄 Pages:</strong> ${analysis.metadata.num_pages || 'Unknown'}</p>`;
                        content += `<p><strong>📏 Size:</strong> ${analysis.metadata.size_kb || 'Unknown'} KB</p>`;
                    }
                    
                    if (analysis.analysis) {
                        content += `<h4>🤖 AI Analysis:</h4>`;
                        content += `<div class="analysis-result">${analysis.analysis.replace(/\n/g, '<br>')}</div>`;
                    } else {
                        content += `<p><em>⚠️ AI analysis not available (API key may not be configured)</em></p>`;
                    }
                } else {
                    content += `<p>❌ Analysis failed: ${analysis.error}</p>`;
                }
                
                showResult(content, analysis.success ? 'success' : 'error');
            } else {
                showResult(`❌ Error: ${result.error}`, 'error');
            }
        }

        async function parseResume() {
            if (!selectedFile) {
                showResult('Please select a PDF file first!', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('include_raw_text', 'true');

            const result = await makeRequest('parse-resume', formData, 'parseBtn', '📄 Extracting...');

            if (result.success) {
                const parsing = result.data;
                let content = '<h3>📄 Text Extraction (PyPDF)</h3>';
                
                if (parsing.success) {
                    if (parsing.metadata) {
                        content += `<p><strong>📄 Pages:</strong> ${parsing.metadata.num_pages || 'Unknown'}</p>`;
                        content += `<p><strong>📏 Size:</strong> ${parsing.metadata.size_kb || 'Unknown'} KB</p>`;
                    }
                    
                    if (parsing.extracted_text) {
                        const textLength = parsing.extracted_text.length;
                        content += `<p><strong>📝 Extracted Text:</strong> ${textLength} characters</p>`;
                        content += `<div class="metadata">${parsing.extracted_text.substring(0, 1000)}${textLength > 1000 ? '...' : ''}</div>`;
                    }
                    
                    content += `<p><strong>Status:</strong> ${parsing.analysis}</p>`;
                } else {
                    content += `<p>❌ Text extraction failed: ${parsing.error}</p>`;
                }
                
                showResult(content, parsing.success ? 'success' : 'error');
            } else {
                showResult(`❌ Error: ${result.error}`, 'error');
            }
        }

        // Check server status on page load
        window.onload = async function() {
            try {
                const response = await fetch('http://127.0.0.1:8001/api/v1/health');
                if (response.ok) {
                    const health = await response.json();
                    console.log('✅ Server status:', health);
                } else {
                    showResult('⚠️ Server not responding. Make sure the Dolphin server is running on port 8001.', 'error');
                }
            } catch (error) {
                showResult('❌ Cannot connect to server. Please start the Dolphin server first.', 'error');
            }
        };
    </script>
</body>
</html>
